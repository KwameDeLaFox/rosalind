# Render Blueprint for Synthetic Page Feedback
# https://render.com/docs/blueprint-spec
# This file lets you create the web service in one click from the
# Render dashboard: New > Blueprint > pick this repo.

services:
  - type: web
    name: synthetic-page-feedback
    runtime: node
    plan: free
    region: oregon  # change if you prefer a different region
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    branch: main
    envVars:
      # The LLM is DeepSeek (OpenAI-compatible). The app reads the API
      # key from DEEPSEEK_API_KEY. Get one at https://platform.deepseek.com.
      - key: DEEPSEEK_API_KEY
        sync: false  # you'll enter this on the Render dashboard
      # Optional overrides (sensible defaults are baked into src/lib/deepseek.ts):
      # - key: DEEPSEEK_BASE_URL
      #   value: https://api.deepseek.com
      # - key: DEEPSEEK_MODEL
      #   value: deepseek-flash
      - key: NODE_ENV
        value: production
